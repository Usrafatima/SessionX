name: Trading Time notifications

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke production notification cron
        env:
          CRON_URL: ${{ vars.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set CRON_URL (repository variable) and CRON_SECRET (repository secret)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-response.json -w "%{http_code}" \
            -X GET "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/cron-response.json
          if [ "$code" != "200" ]; then
            exit 1
          fi
